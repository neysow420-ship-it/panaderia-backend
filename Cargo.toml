[package]
name = "panaderia-backend"
version = "0.1.0"
edition = "2024"
default-run = "panaderia-backend"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
subtle = "2.6"
axum = "0.8.9"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors"] }
ulid = "1"

argon2 = "0.6"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
