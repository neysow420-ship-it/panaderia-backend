; CORS para que PouchDB (navegador) pueda leer la réplica del catálogo.
; Se monta como archivo de solo lectura en /opt/couchdb/etc/local.d/.
; CouchDB lo vuelve a leer al recrear el contenedor, así no se pierde al
; actualizar la imagen.

[chttpd]
enable_cors = true

[cors]
origins = http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, if-none-match, if-match, x-requested-with, x-couch-full-commit
credentials = true
