[couchdb]
single_node = true
uuid = d05782d254ad0b4d2300813940ac0cbd

[chttpd]
enable_cors = true

[cors]
origins = http://localhost:5173
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer

[admins]
; El administrador se crea desde COUCHDB_USER/COUCHDB_PASSWORD al inicializar
; el volumen (ver infra/docker-compose.yml). No guardar hashes en el repositorio.
