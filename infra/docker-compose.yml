services:
  couchdb:
    image: couchdb:3.3.3
    container_name: panaderia-couchdb
    restart: unless-stopped

    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Falta COUCHDB_USER en .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Falta COUCHDB_PASSWORD en .env}

    ports:
      - "127.0.0.1:${COUCHDB_PORT:-15984}:5984"

    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  couchdb_data: