services:
  couchdb:
    build:
      context: ./couchdb
    image: panaderia-couchdb:3.3.3
    container_name: panaderia-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Falta COUCHDB_USER en .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Falta COUCHDB_PASSWORD en .env}
    ports:
      - "${COUCHDB_PORT:-15984}:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ..
    container_name: panaderia-api
    restart: unless-stopped
    environment:
      COUCHDB_URL: http://couchdb:5984
      BACKEND_USER: ${BACKEND_USER:-backend}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:?Falta BACKEND_PASSWORD en .env}
      PORT: "3000"
      AUTH_MODE: ${AUTH_MODE:?Falta AUTH_MODE en .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      # Importación directa desde Gmail, deshabilitada por defecto.
      FACTURAS_IMPORTACION_CLAVE: ${FACTURAS_IMPORTACION_CLAVE:-}
      FACTURAS_GMAIL_ACTIVO: ${FACTURAS_GMAIL_ACTIVO:-false}
      FACTURAS_GMAIL_BUZON: ${FACTURAS_GMAIL_BUZON:-}
      FACTURAS_GMAIL_REMITENTE: ${FACTURAS_GMAIL_REMITENTE:-}
      FACTURAS_GMAIL_CLIENT_ID: ${FACTURAS_GMAIL_CLIENT_ID:-}
      FACTURAS_GMAIL_CLIENT_SECRET: ${FACTURAS_GMAIL_CLIENT_SECRET:-}
      FACTURAS_GMAIL_REFRESH_TOKEN: ${FACTURAS_GMAIL_REFRESH_TOKEN:-}
    ports:
      # Host: PORT del .env (5000). Dentro del contenedor siempre 3000.
      - "${PORT:-5000}:3000"
    depends_on:
      couchdb:
        condition: service_healthy

  # Solo para HTTPS en la VM. En local no arranca.
  caddy:
    image: caddy:2
    container_name: panaderia-caddy
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  couchdb_data:
  caddy_data:
  caddy_config:
