services:
  couchdb:
    build:
      context: ./couchdb
    image: panaderia-couchdb:3.3.3
    container_name: panaderia-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Falta COUCHDB_USER en .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Falta COUCHDB_PASSWORD en .env}
    ports:
      - "${COUCHDB_PORT:-15984}:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ..
    container_name: panaderia-api
    restart: unless-stopped
    environment:
      COUCHDB_URL: http://couchdb:5984
      BACKEND_USER: ${BACKEND_USER:-backend}
      BACKEND_PASSWORD: ${BACKEND_PASSWORD:?Falta BACKEND_PASSWORD en .env}
      PORT: "3000"
      AUTH_MODE: ${AUTH_MODE:?Falta AUTH_MODE en .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
    depends_on:
      couchdb:
        condition: service_healthy

  caddy:
    image: caddy:2
    container_name: panaderia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  couchdb_data:
  caddy_data:
  caddy_config: