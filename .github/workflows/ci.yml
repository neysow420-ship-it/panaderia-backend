# Nombre que aparecerá en la pestaña Actions de GitHub
name: CI

# Eventos que activan la automatización
on:
  # Ejecutar cuando se suban cambios a la rama main
  push:
    branches: [main]

  # Ejecutar cuando se cree o actualice un Pull Request hacia main
  pull_request:
    branches: [main]

  # Permitir ejecutar el workflow manualmente desde GitHub
  workflow_dispatch:

# Trabajos que GitHub ejecutará en la máquina virtual
jobs:
  rust:
    # Nombre del trabajo en la interfaz de GitHub
    name: rust

    # Sistema operativo donde se ejecutan las comprobaciones
    runs-on: ubuntu-latest

    # CouchDB real para las pruebas de integración
    services:
      couchdb:
        image: couchdb:3.3.3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: admin-ci
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -f http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      COUCHDB_URL: http://localhost:5984
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin-ci
      COUCHDB_PORT: 5984
      BACKEND_USER: backend
      BACKEND_PASSWORD: backend-ci
      CLIENTE_PASSWORD: cliente-ci
      CAJERO_USUARIO: cajero1
      CAJERO_PASSWORD: cajero-ci
      ENCARGADO_USUARIO: encargado1
      ENCARGADO_PASSWORD: encargado-ci
      JWT_SECRET: jwt-ci-secreto-de-pruebas
      AUTH_MODE: activo
      PANADERIA_INTEGRACION: "1"

    steps:
      # Descargar el código del repositorio en la máquina virtual
      - uses: actions/checkout@v4

      # Avisar si no existe Cargo.toml en la raíz del repositorio
      - name: Aviso si aún no hay proyecto Rust
        if: hashFiles('Cargo.toml') == ''
        run: 'echo "Todavía no existe Cargo.toml, no hay nada que revisar."'

      # Instalar Rust estable y las herramientas de formato y análisis
      - name: Instalar Rust
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Reutilizar la caché para acelerar futuras ejecuciones
      - name: Caché de dependencias
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2

      # Comprobar que el código tenga el formato correcto sin modificarlo
      - name: Formato (cargo fmt)
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --check

      # Analizar el código y tratar las advertencias como errores
      - name: Clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --all-targets -- -D warnings

      # Validar que los datos de siembra sigan el contrato
      - name: Datos canónicos
        if: hashFiles('Cargo.toml') != ''
        run: python3 -m unittest discover -s scripts/pruebas

      # Crear bases, usuarios, vistas, catálogo y usuarios de aplicación
      - name: Preparar CouchDB
        if: hashFiles('Cargo.toml') != ''
        run: ./infra/couchdb/setup.sh

      # Ejecutar pruebas unitarias y de integración (contra CouchDB)
      - name: Pruebas
        if: hashFiles('Cargo.toml') != ''
        run: cargo test -- --test-threads=1
